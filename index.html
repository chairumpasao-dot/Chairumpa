<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แผนที่รายงานการตรวจสอบ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 60px;
      width: min(430px, calc(100vw - 84px));
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 2px 14px #0003;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 19px;
    }

    .subtitle {
      margin: 0 0 12px;
      color: #666;
      font-size: 13px;
    }

    .filters {
      display: grid;
      gap: 8px;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: #fff;
      font: inherit;
    }

    button {
      cursor: pointer;
      border-color: #1677d2;
      background: #1677d2;
      color: #fff;
      font-weight: 600;
    }

    button:hover {
      background: #095eae;
    }

    #summary {
      margin-top: 12px;
      color: #1267ad;
      font-weight: 700;
    }

    #details {
      margin-top: 5px;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    #error {
      margin-top: 10px;
      color: #b00020;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .legend {
      position: absolute;
      z-index: 1000;
      right: 12px;
      bottom: 20px;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 2px 12px #0003;
      font-size: 13px;
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border: 2px solid white;
      border-radius: 50%;
      background: #1685d1;
      box-shadow: 0 0 2px #333;
      vertical-align: -1px;
    }

    .popup {
      min-width: 220px;
      max-width: 330px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .popup-title {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 700;
    }

    .popup-row {
      margin-top: 4px;
    }

    .popup-label {
      font-weight: 700;
    }

    @media (max-width: 600px) {
      #panel {
        top: 8px;
        left: 54px;
        width: calc(100vw - 64px);
        padding: 12px;
      }

      h1 {
        font-size: 17px;
      }

      .legend {
        right: 8px;
        bottom: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <section id="panel">
    <h1>แผนที่รายงานการตรวจสอบ</h1>
    <p class="subtitle">คลิกหมุดบนแผนที่เพื่อดูรายละเอียด</p>

    <div class="filters">
      <input
        id="search"
        type="search"
        placeholder="ค้นหารหัสงานหรือหน่วยรับตรวจ"
      >

      <select id="yearFilter">
        <option value="">ปีงบประมาณ: ทั้งหมด</option>
      </select>

      <select id="unitFilter">
        <option value="">หน่วยรับตรวจ: ทั้งหมด</option>
      </select>

      <select id="resultFilter">
        <option value="">การแจ้งผลการตรวจสอบ: ทั้งหมด</option>
      </select>

      <button id="resetButton" type="button">ล้างตัวกรอง</button>
    </div>

    <div id="summary">กำลังโหลดข้อมูลจากชีต…</div>
    <div id="details"></div>
    <div id="error"></div>
  </section>

  <div class="legend">
    <span class="legend-dot"></span>รายการจากชีต
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Google Sheet และ GID ของแท็บที่ต้องการแสดง
    const SHEET_ID = "1zgK-gxqQWTkt59KfFM7NQr1jRpYTWNdfASLQ7a3G9Yw";
    const SHEET_GID = "1285112231";

    // ลำดับคอลัมน์เริ่มจาก 0: A=0, B=1, C=2 ...
    // อ้างอิงจากหัวตารางในภาพที่ส่งมา
    const COL = {
      fiscalYear: 0,            // A ปีงบประมาณ
      jobId: 1,                 // B รหัสงาน
      longitude: 2,             // C ลองจิจูด
      latitude: 3,              // D ละติจูด
      reportName: 4,            // E ชื่อรายงาน
      procurementType: 5,       // F ประเภทของรายการจัดซื้อจัดจ้าง
      otherItem: 6,             // G ระบุรายการอื่น ๆ
      contractValue: 7,         // H มูลค่าตามสัญญา
      unitCode: 8,              // I รหัสหน่วยรับตรวจ
      unitName: 9,              // J ชื่อหน่วยรับตรวจ
      observation: 10,          // K ข้อสังเกต
      defectType: 11,           // L ประเภทข้อบกพร่อง
      recommendation: 12,       // M ลักษณะข้อเสนอแนะ
      recommendationOther: 13,  // N คำอธิบายกรณีอื่น
      auditResult: 14,          // O การแจ้งผลการตรวจสอบ
      auditResultOther: 15      // P รายละเอียดเพิ่มเติม
    };

    const map = L.map("map").setView([15.8, 102.0], 6);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // ใช้ layerGroup แทน MarkerCluster เพื่อลดปัญหาไลบรารีหมุด
    const markerGroup = L.layerGroup().addTo(map);

    const searchInput = document.getElementById("search");
    const yearFilter = document.getElementById("yearFilter");
    const unitFilter = document.getElementById("unitFilter");
    const resultFilter = document.getElementById("resultFilter");
    const summary = document.getElementById("summary");
    const details = document.getElementById("details");
    const errorBox = document.getElementById("error");

    let allRecords = [];
    let loadTimeout;

    function cellValue(row, columnIndex) {
      const cell = row && row.c ? row.c[columnIndex] : null;

      if (!cell) {
        return "";
      }

      const value =
        cell.f !== null && cell.f !== undefined
          ? cell.f
          : cell.v;

      return value === null || value === undefined
        ? ""
        : String(value).trim();
    }

    function parseCoordinate(value) {
      const normalized = String(value ?? "")
        .replace(/,/g, "")
        .trim();

      if (!normalized) {
        return NaN;
      }

      return Number(normalized);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return entities[character];
      });
    }

    function buildRecord(row, rowNumber) {
      // Leaflet ใช้ลำดับ [ละติจูด, ลองจิจูด]
      const lat = parseCoordinate(cellValue(row, COL.latitude));
      const lng = parseCoordinate(cellValue(row, COL.longitude));

      return {
        rowNumber,
        lat,
        lng,
        fiscalYear: cellValue(row, COL.fiscalYear),
        jobId: cellValue(row, COL.jobId),
        reportName: cellValue(row, COL.reportName),
        unitCode: cellValue(row, COL.unitCode),
        unitName: cellValue(row, COL.unitName),
        defectType: cellValue(row, COL.defectType),
        recommendation: cellValue(row, COL.recommendation),
        recommendationOther: cellValue(row, COL.recommendationOther),
        auditResult: cellValue(row, COL.auditResult),
        auditResultOther: cellValue(row, COL.auditResultOther)
      };
    }

    function fillSelect(selectElement, values, firstOptionText) {
      selectElement.replaceChildren();

      const firstOption = document.createElement("option");
      firstOption.value = "";
      firstOption.textContent = firstOptionText;
      selectElement.appendChild(firstOption);

      const uniqueValues = [...new Set(
        values
          .map(value => String(value ?? "").trim())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "th"));

      uniqueValues.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        selectElement.appendChild(option);
      });
    }

    function displayValue(value) {
      return value ? escapeHtml(value) : "ไม่ระบุ";
    }

    function createPopup(record) {
      const unit = [record.unitCode, record.unitName]
        .filter(Boolean)
        .join(" — ");

      const fields = [
        ["รหัสงาน", record.jobId],
        ["หน่วยรับตรวจ", unit],
        ["ประเภทข้อบกพร่อง", record.defectType],
        [
          "ลักษณะข้อเสนอแนะ",
          record.recommendationOther || record.recommendation
        ],
        [
          "มาตราที่แจ้งผลตรวจสอบ",
          record.auditResultOther
            ? `${record.auditResult} — ${record.auditResultOther}`
            : record.auditResult
        ]
      ];

      const rows = fields.map(([label, value]) => `
        <div class="popup-row">
          <span class="popup-label">${escapeHtml(label)}:</span>
          ${displayValue(value)}
        </div>
      `).join("");

      return `
        <div class="popup">
          <div class="popup-title">รายละเอียดรายการตรวจสอบ</div>
          ${rows}
        </div>
      `;
    }

    function getFilteredRecords() {
      const query = searchInput.value
        .trim()
        .toLocaleLowerCase("th");

      const selectedYear = yearFilter.value;
      const selectedUnit = unitFilter.value;
      const selectedResult = resultFilter.value;

      return allRecords.filter(record => {
        const searchableText = [
          record.jobId,
          record.reportName,
          record.unitCode,
          record.unitName,
          record.defectType,
          record.recommendation,
          record.auditResult,
          record.auditResultOther
        ].join(" ").toLocaleLowerCase("th");

        const matchesSearch =
          !query || searchableText.includes(query);

        const matchesYear =
          !selectedYear || record.fiscalYear === selectedYear;

        const matchesUnit =
          !selectedUnit || record.unitName === selectedUnit;

        const matchesResult =
          !selectedResult || record.auditResult === selectedResult;

        return matchesSearch &&
          matchesYear &&
          matchesUnit &&
          matchesResult;
      });
    }

    function renderMap(zoomToResults = false) {
      const visibleRecords = getFilteredRecords();
      markerGroup.clearLayers();

      visibleRecords.forEach(record => {
        const marker = L.circleMarker(
          [record.lat, record.lng],
          {
            radius: 8,
            color: "#ffffff",
            weight: 2,
            fillColor: "#1685d1",
            fillOpacity: 0.95
          }
        );

        marker.bindPopup(createPopup(record), {
          maxWidth: 360
        });

        markerGroup.addLayer(marker);
      });

      summary.textContent =
        `แสดง ${visibleRecords.length.toLocaleString("th-TH")} ` +
        `จาก ${allRecords.length.toLocaleString("th-TH")} รายการที่มีพิกัด`;

      if (visibleRecords.length > 0 && zoomToResults) {
        const bounds = L.latLngBounds(
          visibleRecords.map(record => [record.lat, record.lng])
        );

        map.fitBounds(bounds, {
          padding: [35, 35],
          maxZoom: 12
        });
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      summary.textContent = "";
      details.textContent = "";
    }

    // Google Sheets เรียกฟังก์ชันนี้เมื่อส่งข้อมูลกลับมา
    window.handleSheet = function(response) {
      clearTimeout(loadTimeout);

      if (!response || response.status === "error") {
        const message =
          response?.errors
            ?.map(error => error.detailed_message || error.message)
            .join("\n")
          || "อ่านข้อมูลจาก Google Sheets ไม่สำเร็จ";

        showError(
          message +
          "\nตรวจสอบสิทธิ์แชร์ชีตว่าเปิดให้ผู้มีลิงก์ดูได้"
        );
        return;
      }

      const rows = response.table?.rows || [];

      // แปลงแถวข้อมูลทั้งหมดเป็นรายการ
      const records = rows.map((row, index) =>
        buildRecord(row, index + 2)
      );

      // ใช้เฉพาะแถวที่มีพิกัดถูกต้อง
      allRecords = records.filter(record =>
        Number.isFinite(record.lat) &&
        Number.isFinite(record.lng) &&
        Math.abs(record.lat) <= 90 &&
        Math.abs(record.lng) <= 180
      );

      const skippedCount = records.length - allRecords.length;

      fillSelect(
        yearFilter,
        allRecords.map(record => record.fiscalYear),
        "ปีงบประมาณ: ทั้งหมด"
      );

      fillSelect(
        unitFilter,
        allRecords.map(record => record.unitName),
        "หน่วยรับตรวจ: ทั้งหมด"
      );

      fillSelect(
        resultFilter,
        allRecords.map(record => record.auditResult),
        "การแจ้งผลการตรวจสอบ: ทั้งหมด"
      );

      if (allRecords.length === 0) {
        showError(
          "โหลดชีตได้ แต่ไม่พบรายการที่มีพิกัดถูกต้อง\n" +
          "ตรวจสอบว่าคอลัมน์ C เป็นลองจิจูด และ D เป็นละติจูด"
        );
        return;
      }

      errorBox.textContent = "";

      details.textContent = skippedCount > 0
        ? `ข้าม ${skippedCount} แถวที่ไม่มีพิกัดหรือพิกัดไม่ถูกต้อง`
        : "ใช้ตัวกรองปีงบประมาณ หน่วยรับตรวจ และการแจ้งผลการตรวจสอบได้";

      renderMap(true);
    };

    function loadSheet() {
      const script = document.createElement("script");
      const tqx = encodeURIComponent(
        "out:json;responseHandler:handleSheet"
      );

      script.src =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
        `?gid=${SHEET_GID}&tqx=${tqx}`;

      script.async = true;

      script.onerror = function() {
        clearTimeout(loadTimeout);
        showError(
          "เชื่อมต่อ Google Sheets ไม่สำเร็จ\n" +
          "ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตและสิทธิ์การแชร์ชีต"
        );
      };

      loadTimeout = setTimeout(() => {
        showError(
          "รอข้อมูลจาก Google Sheets นานเกินไป\n" +
          "ตรวจสอบว่าแชร์ชีตให้ผู้มีลิงก์ดูได้"
        );
      }, 15000);

      document.body.appendChild(script);
    }

    searchInput.addEventListener("input", () => renderMap());
    yearFilter.addEventListener("change", () => renderMap(true));
    unitFilter.addEventListener("change", () => renderMap(true));
    resultFilter.addEventListener("change", () => renderMap(true));

    document
      .getElementById("resetButton")
      .addEventListener("click", () => {
        searchInput.value = "";
        yearFilter.value = "";
        unitFilter.value = "";
        resultFilter.value = "";
        renderMap(true);
      });

    loadSheet();
  </script>
</body>
</html>
